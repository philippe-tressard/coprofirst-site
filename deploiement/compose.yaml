#
# Le site sur l'instance Oracle « coprofirst-demo ». Port 8080 de la boucle locale
# uniquement : cloudflared y envoie coprofirst.fr et www.coprofirst.fr. Le port 80
# est réservé à la démonstration (demo.coprofirst.fr → http://localhost:80).
name: coprofirst-site
services:
  site:
    build:
      context: ..
      dockerfile: deploiement/Dockerfile
    image: coprofirst-site:courant
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    # Le binaire caddy de l'image porte la capacité de fichier NET_BIND_SERVICE :
    # sans elle dans l'ensemble autorisé, no-new-privileges refuse de l'exécuter
    # (« exec /usr/bin/caddy: operation not permitted », constaté le 13/10/2026).
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs: [/config, /data]

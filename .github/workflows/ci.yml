#
# Les contrôles que Windows et l'oubli ne laissent pas passer.
# Actions épinglées par SHA, outils par version : la CI se rejoue à l'identique.
name: CI
on:
  push:
  pull_request:

permissions:
  contents: read
  # L'alerte d'échec ouvre un ticket (scripts/signaler-echec-ci.py).
  issues: write

jobs:
  depot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # L'historique entier : verifier-referencement.py date chaque page de son
          # dernier commit (un clone superficiel les daterait toutes du dernier).
          fetch-depth: 0
      # Les contrôles hors réseau, leurs selftests d'abord : la liste vit dans
      # scripts/controles.sh, que le pre-commit appelle aussi (coprofirst-site#130).
      - name: Contrôles hors réseau (selftests, puis le dépôt)
        run: bash scripts/controles.sh --selftest
      # Le même Caddy que l'image, lu au FROM du Dockerfile (une seule écriture, que
      # Dependabot monte) : un Caddyfile invalide ne part pas.
      - name: Caddyfile valide
        run: |
          image=$(sed -n 's/^FROM //p' deploiement/Dockerfile)
          [ -n "$image" ] || { echo "INCONNU : aucun FROM dans deploiement/Dockerfile"; exit 2; }
          docker run --rm -v "$PWD/deploiement/Caddyfile:/etc/caddy/Caddyfile:ro" "$image" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      # Valide n'est pas conforme : l'image construite, démarrée et interrogée —
      # en-têtes, 404, compression, octets identiques au dépôt.
      - name: Le site servi par l'image (en-têtes, 404, compression)
        run: bash scripts/verifier-service.sh
      - name: Licences (REUSE)
        run: |
          python -m pip install -r .github/requirements-ci.txt
          python -m reuse lint
      # Le DERNIER pas : un rouge sur main ou au passage planifié ouvre un ticket
      # (sept jours de rouge muet, fin octobre 2026). Sur une PR, rien.
      - name: Alerte d'échec — un ticket ouvert, ou commenté s'il l'est déjà
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/signaler-echec-ci.py --signaler

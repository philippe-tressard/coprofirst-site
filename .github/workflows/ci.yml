#
# Les contrôles que Windows et l'oubli ne laissent pas passer.
# Actions épinglées par SHA, outils par version : la CI se rejoue à l'identique.
name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  depot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # L'historique entier : verifier-referencement.py date chaque page de son
          # dernier commit (un clone superficiel les daterait toutes du dernier).
          fetch-depth: 0
      - name: Le contrôle lui-même (selftest)
        run: bash scripts/verifier-depot.sh --selftest
      - name: Encodage, fins de ligne, bits d'exécution, syntaxe des scripts
        run: bash scripts/verifier-depot.sh
      - name: Référencement (selftest)
        run: python3 scripts/verifier-referencement.py --selftest
      - name: Référencement — canoniques, Open Graph, JSON-LD, sitemap, robots.txt, llms.txt
        run: python3 scripts/verifier-referencement.py
      # avis.json n'est pas versionné : le fichier lui-même se contrôle au déploiement.
      - name: Contrôle des avis publiés (selftest)
        run: python3 scripts/verifier-avis.py --selftest
      - name: Récupération de l'export des avis (selftest)
        run: python3 scripts/recuperer-avis.py --selftest
      - name: Empreintes des CSS et JS (selftest)
        run: python3 scripts/empreintes.py --selftest
      - name: Empreintes des CSS et JS — chaque adresse porte l'empreinte de son contenu
        run: python3 scripts/empreintes.py
      - name: Feuilles de style (selftest)
        run: python3 scripts/verifier-css.py --selftest
      - name: Feuilles de style — contrastes des jetons, survol et appui
        run: python3 scripts/verifier-css.py
      - name: security.txt (selftest)
        run: python3 scripts/verifier-security-txt.py --selftest
      # Le même Caddy que l'image (Dockerfile) : un Caddyfile invalide ne part pas.
      - name: Caddyfile valide
        run: docker run --rm -v "$PWD/deploiement/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      # Valide n'est pas conforme : l'image construite, démarrée et interrogée —
      # en-têtes, 404, compression, octets identiques au dépôt (coprofirst-site#28).
      - name: Le site servi par l'image (en-têtes, 404, compression)
        run: bash scripts/verifier-service.sh
      - name: Licences (REUSE)
        run: |
          python -m pip install reuse==6.2.0
          python -m reuse lint

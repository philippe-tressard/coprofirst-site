#
# Le site dit-il encore vrai sur CoproFirst ? Les comptes publiés par
# site/demo.html, et la version affichée par l'accueil (dernière release).
# Hors du pre-commit : la source vit dans le dépôt de CoproFirst, et la lire
# demande le réseau. Le passage QUOTIDIEN attrape un compte changé ou une version
# promue côté application, même quand ce site ne bouge pas — et l'échéance de
# site/.well-known/security.txt, qui expire sans qu'aucun commit ne le dise ; son échec part par
# courriel (notifications GitHub des workflows planifiés).
# ⚠️ GitHub suspend un workflow planifié après 60 jours sans activité du dépôt.
name: Concordance avec CoproFirst
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  comptes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Le contrôle lui-même (selftest)
        run: python3 scripts/verifier-comptes-demo.py --selftest
      - name: demo.html contre api/app/demo/personnages.py (coprofirst, main)
        run: python3 scripts/verifier-comptes-demo.py
      - name: La version affichée (selftest)
        run: python3 scripts/version-produit.py --selftest
      - name: index.html contre la dernière release de coprofirst
        run: python3 scripts/version-produit.py
      # Pas une concordance : une date qui passe. Sa place est dans le passage quotidien.
      - name: L'échéance de security.txt (un mois de préavis)
        run: python3 scripts/verifier-security-txt.py
      # Un ticket supprimé sur GitHub ne laisse aucun commit : le passage quotidien
      # attrape le renvoi qui ne mène plus nulle part. Jeton : la limite de débit.
      - name: Chaque ticket cité existe encore (coprofirst-site#N)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/verifier-renvois.py --en-ligne
